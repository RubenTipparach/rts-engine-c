name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  native:
    name: native (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GL/X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libxi-dev libxcursor-dev

      - name: Build native
        run: make native

      - name: Smoke check binary
        run: file build/native/rts-engine

  web:
    name: web (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build web
        run: make web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
